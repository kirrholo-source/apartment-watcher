name: Apartment watcher

on:
  schedule:
    - cron: "*/5 * * * *"   # every 10 min (GitHub may delay runs a bit)
  workflow_dispatch:          # adds a "Run workflow" button for manual runs

permissions:
  contents: write             # needed to save apartment_state.json back to the repo

concurrency:
  group: apartment-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check apartment sites
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python apartment_watcher.py --once

      - name: Save state (so you're only alerted about new listings)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898222+github-actions[bot]@users.noreply.github.com"
          git add apartment_state.json
          git diff --staged --quiet || (git commit -m "Update apartment state [skip ci]" && git push)
